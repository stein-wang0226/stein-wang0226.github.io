name: Validate site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build.py --output "$RUNNER_TEMP/site-build"
      - run: python scripts/check.py --output "$RUNNER_TEMP/site-build"
      - name: Verify build did not modify sources
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
