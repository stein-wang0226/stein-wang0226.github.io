<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img" aria-labelledby="group-chart-title" style="display:block;width:100%;height:auto">
<desc id="group-chart-title">解析示例：G等于8时，难题和易题拥有非零奖励方差的组比例远低于中等难度题</desc>
<rect width="800" height="230" fill="#fcfbf7"/><g font-family="system-ui,sans-serif" fill="#172d35" font-size="15">
<text x="30" y="32">二值奖励有效组概率 · G=8 · 独立采样解析值</text>
<text x="30" y="78">p = 1%</text><text x="30" y="125">p = 50%</text><text x="30" y="172">p = 99%</text>
<rect x="135" y="56" width="43.3" height="30" rx="4" fill="#a9c3b7"/><rect x="135" y="103" width="555.6" height="30" rx="4" fill="#0f766e"/><rect x="135" y="150" width="43.3" height="30" rx="4" fill="#a9c3b7"/>
<text x="190" y="77">7.7%</text><text x="706" y="124">99.2%</text><text x="190" y="171">7.7%</text>
<text x="30" y="211" fill="#52666b" font-size="13">这是概率推导，非训练实测；相关采样或连续奖励不满足此模型。</text>
</g></svg>
